<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CineFlix | Busca de Filmes</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>🎬 CineFlix</h1>
        <p>Encontre informações sobre seus filmes favoritos!</p>
    </header>

    <main>

        <section class="pesquisa">
            <h2>Qual filme você quer encontrar?</h2>

            <div class="barra-pesquisa">
                <input
                    type="text"
                    id="filme"
                    placeholder="Digite o nome de um filme..."
                >

                <button id="botaoBuscar">
                    🔍 Buscar
                </button>
            </div>
        </section>

        <p id="mensagem"></p>

        <section id="resultado"></section>

    </main>

    <footer>
        <p>🎬 CineFlix | Projeto de integração com API</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
